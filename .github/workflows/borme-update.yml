name: BORME incremental update

# Fetches new BORME Section A days for the Catalan provinces and applies them to
# the Turso admin-history DB. Progress is stored in Turso (borme_meta), so a
# failed or skipped run is simply caught up by the next one.
on:
  schedule:
    # BORME is published Mon-Fri in the morning (Madrid); run in the late afternoon.
    # Off the top of the hour on purpose: GitHub delays :00 schedules the most
    # (the 18:00 run on 2026-11-09 only started at 01:12 UTC).
    - cron: "23 16 * * 1-5"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional YYYY-MM-DD to (re)process from; defaults to the day after borme_meta.last_processed_date"
        required: false
        default: ""

concurrency:
  group: borme-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-borme.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements-borme.txt

      - name: Apply new BORME days to Turso
        id: update
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
          START_DATE: ${{ inputs.start_date }}
        run: |
          args=(--archive-dir "" --workers 6)
          if [ -n "$START_DATE" ]; then args+=(--start-date "$START_DATE"); fi
          python3 scripts/borme_incremental_update.py "${args[@]}"

      - name: Rebuild related-companies graph (company_links, diff-synced)
        # Skipped when no BORME day brought changes (weekday holidays); manual runs always rebuild.
        if: steps.update.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
        run: python3 scripts/borme_build_company_graph.py

      - name: Health checks (fails the job, and GitHub emails you, if the DB looks wrong)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_WRITE_TOKEN: ${{ secrets.TURSO_WRITE_TOKEN }}
        run: python3 scripts/borme_check.py

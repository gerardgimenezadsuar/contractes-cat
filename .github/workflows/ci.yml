name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Build and tests run against the mock Socrata server, never the public API.
      SOCRATA_ORIGIN_OVERRIDE: http://127.0.0.1:4545
      SEARCH_INDEX_DISABLED: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Start mock Socrata (for build-time prerendering)
        run: |
          node tests/mock-socrata/server.mjs 4545 &
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:4545/health && break; sleep 0.5; done

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests (mobile + desktop)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
